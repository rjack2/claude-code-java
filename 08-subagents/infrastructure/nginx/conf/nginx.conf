events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    init_worker_by_lua_block {
        local pkey = require "resty.openssl.pkey"
        
        local file, err = io.open("/etc/nginx/certs/public.pem", "rb")
        if not file then
            ngx.log(ngx.ERR, "Failed to open public key: ", err)
            return
        end

        local pem_contents = file:read("*a")
        file:close()

        local pubkey, pkey_err = pkey.new(pem_contents)
        if not pubkey then
            ngx.log(ngx.ERR, "Failed to parse public key into OpenSSL object: ", pkey_err)
            return
        end

        _G.PUBLIC_KEY = pubkey
    }

    upstream user-service-upstream {
        server user-service:8080;
    }

    upstream movie-service-upstream {
        server movie-service:8080;
    }

    upstream recommendation-service-upstream {
        server recommendation-service:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Public Endpoints
        location ~ ^/api/users/(login|register) {
            proxy_pass http://user-service-upstream; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Protected Users Endpoints
        location /api/users {
            set $user_id "";
            access_by_lua_file /etc/nginx/validate_jwt.lua;
            
            proxy_set_header X-User-Id $user_id; 
            proxy_pass http://user-service-upstream;
        }

        # Protected Movies Endpoints
        location /api/movies {
            set $user_id "";
            access_by_lua_file /etc/nginx/validate_jwt.lua;
            
            proxy_set_header X-User-Id $user_id;
            proxy_pass http://movie-service-upstream;
        }

        # Protected Recommendations Endpoints
        location /api/recommendations {
            set $user_id "";
            access_by_lua_file /etc/nginx/validate_jwt.lua;
            
            proxy_set_header X-User-Id $user_id;
            proxy_pass http://recommendation-service-upstream; 
        }
    }
}