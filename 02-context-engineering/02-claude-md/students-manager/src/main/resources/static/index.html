<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Manager</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #059669;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --border: #334155;
                --primary: #818cf8;
                --primary-hover: #6366f1;
                --danger: #f87171;
                --danger-bg: #3b1d1d;
                --success: #34d399;
                --shadow: 0 1px 3px rgba(0,0,0,.4);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
        }
        header h1 { margin: 0; font-size: 1.25rem; }
        header p { margin: 0; color: var(--muted); font-size: .875rem; }
        main {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.25rem;
        }
        .card h2 { margin: 0 0 1rem; font-size: 1rem; }
        label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
        input {
            width: 100%;
            padding: .6rem .75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: .95rem;
        }
        input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
        .field { margin-bottom: .9rem; }
        .field-error { color: var(--danger); font-size: .75rem; min-height: 1em; display: block; margin-top: .2rem; }
        .actions { display: flex; gap: .5rem; }
        button {
            border: none;
            border-radius: 8px;
            padding: .55rem 1rem;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger-bg); color: var(--danger); }
        .btn-sm { padding: .35rem .7rem; font-size: .8rem; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .toolbar h2 { margin: 0; }
        .toolbar input { max-width: 240px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { text-align: left; padding: .7rem .5rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
        td.row-actions { text-align: right; white-space: nowrap; }
        td.row-actions button + button { margin-left: .35rem; }
        tr.editing { background: color-mix(in srgb, var(--primary) 10%, transparent); }
        .badge {
            display: inline-block;
            padding: .1rem .55rem;
            border-radius: 999px;
            background: color-mix(in srgb, var(--primary) 15%, transparent);
            color: var(--primary);
            font-size: .8rem;
            font-weight: 600;
        }
        .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: .75rem 1rem;
            border-radius: 8px;
            color: #fff;
            font-size: .9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all .2s ease;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.success { background: var(--success); }
        #toast.error { background: var(--danger); }
    </style>
</head>
<body>
<header>
    <h1>Students Manager</h1>
    <p>Create, update, delete and browse students</p>
</header>

<main>
    <section class="card">
        <h2 id="form-title">Add Student</h2>
        <form id="student-form" novalidate>
            <input type="hidden" id="student-id">
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" maxlength="100" required>
                <span class="field-error" data-for="name"></span>
            </div>
            <div class="field">
                <label for="age">Age</label>
                <input id="age" name="age" type="number" min="1" max="150" required>
                <span class="field-error" data-for="age"></span>
            </div>
            <div class="field">
                <label for="className">Class</label>
                <input id="className" name="className" maxlength="50" required>
                <span class="field-error" data-for="className"></span>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary" id="submit-btn">Add</button>
                <button type="button" class="btn-secondary" id="cancel-btn" hidden>Cancel</button>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="toolbar">
            <h2>Students <span class="badge" id="count">0</span></h2>
            <input id="search" type="search" placeholder="Search by name or class…">
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>ID</th><th>Name</th><th>Age</th><th>Class</th><th></th></tr>
                </thead>
                <tbody id="students-body"></tbody>
            </table>
        </div>
    </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
    const API = '/api/students';

    const form = document.getElementById('student-form');
    const idInput = document.getElementById('student-id');
    const nameInput = document.getElementById('name');
    const ageInput = document.getElementById('age');
    const classInput = document.getElementById('className');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const tbody = document.getElementById('students-body');
    const countBadge = document.getElementById('count');
    const searchInput = document.getElementById('search');
    const toast = document.getElementById('toast');

    let students = [];

    // ---------- API ----------
    async function request(url, options = {}) {
        const response = await fetch(url, {
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            ...options
        });
        if (response.status === 204) return null;
        const body = await response.json().catch(() => null);
        if (!response.ok) {
            const error = new Error(body?.detail || `Request failed (${response.status})`);
            error.problem = body;
            throw error;
        }
        return body;
    }

    const api = {
        list:   ()         => request(API),
        create: (data)     => request(API, { method: 'POST', body: JSON.stringify(data) }),
        update: (id, data) => request(`${API}/${id}`, { method: 'PUT', body: JSON.stringify(data) }),
        remove: (id)       => request(`${API}/${id}`, { method: 'DELETE' })
    };

    // ---------- Rendering ----------
    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value ?? '';
        return div.innerHTML;
    }

    function render() {
        const term = searchInput.value.trim().toLowerCase();
        const visible = students.filter(s =>
            !term || s.name.toLowerCase().includes(term) || s.className.toLowerCase().includes(term));

        countBadge.textContent = students.length;

        if (visible.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty">${
                students.length ? 'No students match your search.' : 'No students yet. Add one using the form.'
            }</td></tr>`;
            return;
        }

        const editingId = idInput.value;
        tbody.innerHTML = visible.map(s => `
            <tr class="${String(s.id) === editingId ? 'editing' : ''}">
                <td>${s.id}</td>
                <td>${escapeHtml(s.name)}</td>
                <td>${s.age}</td>
                <td><span class="badge">${escapeHtml(s.className)}</span></td>
                <td class="row-actions">
                    <button class="btn-secondary btn-sm" data-action="edit" data-id="${s.id}">Edit</button>
                    <button class="btn-danger btn-sm" data-action="delete" data-id="${s.id}">Delete</button>
                </td>
            </tr>`).join('');
    }

    function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = `show ${type}`;
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.className = '', 2500);
    }

    function clearFieldErrors() {
        document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
    }

    function showFieldErrors(errors = {}) {
        Object.entries(errors).forEach(([field, message]) => {
            const el = document.querySelector(`.field-error[data-for="${field}"]`);
            if (el) el.textContent = message;
        });
    }

    function resetForm() {
        form.reset();
        idInput.value = '';
        formTitle.textContent = 'Add Student';
        submitBtn.textContent = 'Add';
        cancelBtn.hidden = true;
        clearFieldErrors();
        render();
    }

    function startEdit(id) {
        const s = students.find(x => x.id === id);
        if (!s) return;
        idInput.value = s.id;
        nameInput.value = s.name;
        ageInput.value = s.age;
        classInput.value = s.className;
        formTitle.textContent = `Edit Student #${s.id}`;
        submitBtn.textContent = 'Save';
        cancelBtn.hidden = false;
        clearFieldErrors();
        render();
        nameInput.focus();
    }

    // ---------- Actions ----------
    async function loadStudents() {
        try {
            students = await api.list();
            render();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearFieldErrors();
        const payload = {
            name: nameInput.value.trim(),
            age: ageInput.value === '' ? null : Number(ageInput.value),
            className: classInput.value.trim()
        };
        const id = idInput.value;
        try {
            if (id) {
                await api.update(id, payload);
                showToast('Student updated');
            } else {
                await api.create(payload);
                showToast('Student added');
            }
            resetForm();
            await loadStudents();
        } catch (e) {
            showFieldErrors(e.problem?.errors);
            showToast(e.message, 'error');
        }
    });

    cancelBtn.addEventListener('click', resetForm);
    searchInput.addEventListener('input', render);

    tbody.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const id = Number(button.dataset.id);

        if (button.dataset.action === 'edit') {
            startEdit(id);
            return;
        }

        const student = students.find(s => s.id === id);
        if (!confirm(`Delete student "${student?.name}"?`)) return;
        try {
            await api.remove(id);
            if (idInput.value === String(id)) resetForm();
            showToast('Student deleted');
            await loadStudents();
        } catch (e) {
            showToast(e.message, 'error');
        }
    });

    loadStudents();
</script>
</body>
</html>
